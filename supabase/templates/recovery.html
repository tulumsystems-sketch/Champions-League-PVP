<h2>Restablecé tu contraseña</h2>
<p>Hacé clic en el botón para elegir una contraseña nueva:</p>
<p>
  <a href="{{ .ConfirmationURL }}">Elegir nueva contraseña</a>
</p>
<p>Si el enlace no abre, ingresá este código de 6 dígitos en la app:</p>
<p style="font-size: 28px; letter-spacing: 6px; font-weight: 700;">{{ .Token }}</p>
<p>Si no pediste este cambio, ignorá este correo.</p>
